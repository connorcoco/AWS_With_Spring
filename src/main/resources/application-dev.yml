      host: localhost
      port: 6379

  jwt:
    secret: 5d41402abc4b2a76b9719d911017c592

springdoc:
  show-login-endpoint: true

logging:
  level:
    org.springframework.data.redis: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus